[project]
name = "ida-sdk"
version = "0.1.0"
description = "Ida for Python: records event-driven code (Kafka, RabbitMQ, your own events) and replays it in the Ida viewer"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.0"]
rabbitmq = ["pika>=1.0"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "confluent-kafka==2.16.0",
  "pika==1.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ida"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Optional[X] / Union[X, Y]: the SDK supports Python 3.9, where X | None fails wherever annotations are evaluated.
ignore = ["UP007", "UP045"]

[tool.mypy]
python_version = "3.10"  # the oldest mypy checks; the code itself targets 3.9 (see ruff)
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pika", "pika.*"]  # pika ships no type hints
ignore_missing_imports = true
